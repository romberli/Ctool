name: Build for UOS/Debian10

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: rockylinux:8

    steps:
      - name: Install system dependencies
        run: |
          dnf install -y epel-release
          dnf install -y curl wget gnupg2 ca-certificates git
          curl -fsSL https://rpm.nodesource.com/setup_20.x | bash -
          dnf install -y nodejs
          npm install -g pnpm@9
          dnf install -y gcc gcc-c++ make pkgconfig gtk3-devel webkit2gtk3-devel libappindicator-gtk3-devel librsvg2-devel openssl-devel patchelf file atk-devel cairo-devel gdk-pixbuf2-devel pango-devel

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache pnpm
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/ctool-adapter/tauri/src-tauri

      - name: Build Web Assets
        run: |
          pnpm install
          pnpm run build
          ls -la packages/ctool-core/dist

      - name: Build Tauri
        run: |
          cd packages/ctool-adapter/tauri
          pnpm run init
          pnpm tauri build --target x86_64-unknown-linux-gnu
          ls -la src-tauri/target/release/bundle/

      - name: Prepare Release
        run: |
          mkdir -p _release
          cp packages/ctool-adapter/tauri/src-tauri/target/release/ctool _release/ctool-linux-x64-glibc228
          chmod +x _release/ctool-linux-x64-glibc228
          ls -lh _release/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ctool-linux-x64-glibc228
          path: _release/ctool-linux-x64-glibc228
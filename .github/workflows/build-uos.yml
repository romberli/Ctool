name: Build for UOS/Debian10

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl wget gnupg2 ca-certificates git
          curl -fsSL https://deb.nodesource.com/setup_20.x | sudo bash -
          sudo apt-get install -y nodejs
          npm install -g pnpm@9
          sudo apt-get install -y build-essential libgtk-3-dev webkit2gtk-4.0 libappindicator3-dev librsvg2-dev patchelf libssl-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache pnpm
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/ctool-adapter/tauri/src-tauri

      - name: Build Web Assets
        run: |
          pnpm install
          pnpm run build
          ls -la packages/ctool-core/dist

      - name: Build Tauri
        run: |
          cd packages/ctool-adapter/tauri
          pnpm run init
          pnpm tauri build --target x86_64-unknown-linux-gnu
          ls -la src-tauri/target/release/bundle/

      - name: Check binary dependencies
        run: |
          mkdir -p _release
          cp packages/ctool-adapter/tauri/src-tauri/target/release/ctool _release/ctool-linux-x64
          chmod +x _release/ctool-linux-x64
          ldd _release/ctool-linux-x64
          file _release/ctool-linux-x64

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ctool-linux-x64
          path: _release/ctool-linux-x64
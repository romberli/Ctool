name: Build Linux AppImage with Icon

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Dist File (gh-pages)
        uses: actions/checkout@v4
        with:
          repository: baiy/Ctool
          path: packages/ctool-core/dist
          ref: gh-pages

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev webkit2gtk-4.0 libappindicator3-dev librsvg2-dev patchelf

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/ctool-adapter/tauri/src-tauri

      - name: Install dependencies
        run: pnpm install

      - name: Initialize
        run: pnpm run initialize

      - name: Check dist files
        run: ls -la packages/ctool-core/dist

      - name: Build Tauri
        run: |
          cd packages/ctool-adapter/tauri
          pnpm run init
          pnpm tauri build

      - name: Check build output
        run: ls -la packages/ctool-adapter/tauri/src-tauri/target/release/bundle/

      - name: List AppImage contents
        run: |
          APPIMAGE=$(find packages/ctool-adapter/tauri/src-tauri/target/release/bundle/appimage -name "*.AppImage" | head -1)
          if [ -f "$APPIMAGE" ]; then
            echo "Found AppImage: $APPIMAGE"
            ls -la "$APPIMAGE"
            # Extract and inspect the AppImage
            "$APPIMAGE" --appimage-extract &>/dev/null || true
            if [ -d "squashfs-root" ]; then
              echo "=== AppImage contents ==="
              ls -la squashfs-root/
              echo "=== .desktop file ==="
              cat squashfs-root/*.desktop || echo "No .desktop file found"
              echo "=== Icon files ==="
              find squashfs-root -name "*.png" -o -name "*.svg" || echo "No icons found"
            fi
          else
            echo "No AppImage found!"
          fi

      - name: Prepare release
        run: |
          mkdir -p _release
          cp packages/ctool-adapter/tauri/src-tauri/target/release/bundle/appimage/*.AppImage _release/ || true
          cp packages/ctool-adapter/tauri/src-tauri/target/release/bundle/deb/*.deb _release/ || true
          ls -lh _release/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ctool-linux
          path: _release/
name: Build for UOS/Debian10

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:10

    steps:
      - name: Fix apt sources for Debian 10 (archived)
        run: |
          echo "deb http://archive.debian.org/debian buster main contrib non-free" > /etc/apt/sources.list
          echo "deb http://archive.debian.org/debian buster-updates main contrib non-free" >> /etc/apt/sources.list
          echo "deb http://archive.debian.org/debian-security buster/updates main contrib non-free" >> /etc/apt/sources.list
          echo "Acquire::Check-Valid-Until false;" > /etc/apt/apt.conf.d/99no-check-valid-until

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y curl wget gnupg2 ca-certificates lsb-release
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y nodejs
          npm install -g pnpm@9
          apt-get install -y build-essential libgtk-3-dev webkit2gtk-4.0 libappindicator3-dev librsvg2-dev patchelf libssl-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Checkout
        uses: actions/checkout@v4

      

      - name: Cache pnpm
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/ctool-adapter/tauri/src-tauri

      - name: Initialize and Build
        run: |
          pnpm install
          pnpm run initialize
          ls -la packages/ctool-core/dist

      - name: Build Tauri
        run: |
          cd packages/ctool-adapter/tauri
          pnpm run init
          pnpm tauri build --target x86_64-unknown-linux-gnu
          ls -la src-tauri/target/release/bundle/

      - name: Prepare Release
        run: |
          mkdir -p _release
          cp packages/ctool-adapter/tauri/src-tauri/target/release/ctool _release/ctool-linux-x64-debian10
          chmod +x _release/ctool-linux-x64-debian10
          ls -lh _release/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ctool-linux-x64-debian10
          path: _release/ctool-linux-x64-debian10